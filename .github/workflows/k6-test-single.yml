name: k6 Test

on:
  workflow_dispatch:
jobs:
  k6-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        run_id: [1]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Download Environment
        run: |
          echo "Downloading test.js from remote repository"

          # Initialize a temporary git repository
          git init temp-rinha
          cd temp-rinha

          # Add remote and enable sparse checkout
          git remote add origin https://github.com/zanfranceschi/rinha-de-backend-2026.git
          git config core.sparseCheckout true

          # Define folder to checkout
          echo "test/" >> .git/info/sparse-checkout

          # Pull only the specified folder
          git pull origin main

          # Move the test folder to workspace root while preserving structure
          mv test ../temp/test
          cd ..
          rm -rf temp-rinha

          # Set environment variables
          echo "K6_TEST_FILE=temp/test/test.js" >> $GITHUB_ENV
          echo "RESULTS_FILE=temp/test/results.json" >> $GITHUB_ENV
          echo "PROJECT_FOLDER=src" >> $GITHUB_ENV

      - name: Build and start services
        run: cd $PROJECT_FOLDER && docker compose up -d --build
        
      - name: Wait for nginx to be healthy (5 successes)
        run: |
          SUCCESS_COUNT=0
          ATTEMPTS=0

          while [ $ATTEMPTS -lt 60 ]; do
            ATTEMPTS=$((ATTEMPTS+1))
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9999/ready || true)

            if [ "$STATUS" -eq 200 ]; then
              SUCCESS_COUNT=$((SUCCESS_COUNT+1))
              echo "Success $SUCCESS_COUNT/5 (HTTP 200)"
              if [ $SUCCESS_COUNT -ge 5 ]; then
                echo "ok, nginx is up (5 consecutive HTTP 200s)"
                exit 0
              fi
            else
              echo "Waiting for nginx... attempt $ATTEMPTS/60 (last status: $STATUS)"
              SUCCESS_COUNT=0 # reset if it fails
            fi

            sleep 2
          done

          echo "bad, nginx did not become healthy in time"
          exit 1

      - uses: grafana/setup-k6-action@v1

      - name: Run k6 test
        run: k6 run ${K6_TEST_FILE}

      - name: Upload JSON Results
        uses: actions/upload-artifact@v4
        with:
          name: results-json-${{ matrix.run_id }}
          path: ${{ env.RESULTS_FILE }}
          retention-days: 1
          
      - name: Create Comment MD File
        if: always()
        run: |
          echo "## k6 Test Results" > comment.md
          echo "Hash: ${{ github.sha }}" >> comment.md
          echo '```json' >> comment.md

          if [ -f "${RESULTS_FILE}" ]; then
            cat "${RESULTS_FILE}" >> comment.md
          else
            echo "// No k6 results file found (${RESULTS_FILE})" >> comment.md
          fi

          echo '```' >> comment.md

      - name: Append Docker Compose Logs
        if: always()
        run: |
          echo "## Docker Compose Logs" >> comment.md
          echo '```log' >> comment.md
          cd $PROJECT_FOLDER && docker compose logs
          cd $PROJECT_FOLDER && docker compose logs >> comment.md || true
          echo '```' >> comment.md

      - name: Echo comment.md contents
        if: always()
        run: cat comment.md

      - name: Upload comment.md as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: comment-md-${{ matrix.run_id }}
            path: comment.md
            retention-days: 1