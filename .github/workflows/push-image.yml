name: Build and Push Docker Image

on:
  workflow_dispatch:

env:
  SOURCE_FOLDER: src
  IMAGE_NAME_1: rinha-de-backend-2026-dotnet-csharp-with-faiss
  IMAGE_NAME_2: rinha-de-backend-2026-dotnet-csharp-with-python-faiss

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: |
          cd ${{ env.SOURCE_FOLDER }}
          docker compose build

      - name: Tag images
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          REPO=ghcr.io/${{ github.repository_owner }}

          for IMAGE in \
            ${{ env.IMAGE_NAME_1 }} \
            ${{ env.IMAGE_NAME_2 }}
          do
            SRC_IMAGE=$IMAGE

            TIMESTAMP_TAG=$REPO/$IMAGE:$TIMESTAMP
            LATEST_TAG=$REPO/$IMAGE:latest

            docker tag $SRC_IMAGE $TIMESTAMP_TAG
            docker tag $SRC_IMAGE $LATEST_TAG

            echo "Tagged $IMAGE"
          done

      - name: Push images
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          REPO=ghcr.io/${{ github.repository_owner }}

          for IMAGE in \
            ${{ env.IMAGE_NAME_1 }} \
            ${{ env.IMAGE_NAME_2 }}
          do
            docker push $REPO/$IMAGE:latest
            docker push $REPO/$IMAGE:$TIMESTAMP
          done

          echo "TIMESTAMP TAG=$TIMESTAMP"