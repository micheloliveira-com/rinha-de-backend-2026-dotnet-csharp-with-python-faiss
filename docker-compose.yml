services:
  backend-1:
    image: ghcr.io/micheloliveira-com/rinha-de-backend-2026-dotnet-csharp-with-faiss:20260507141710
    hostname: backend-1
    volumes:
      - sock:/run/sock
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - LISTEN_SOCK=/run/sock/api-1.sock
      - ConnectionStrings__faiss=http://faiss-backend:5000
    healthcheck:
      test: >
      interval: 1h
      timeout: 70s
      retries: 0
      start_period: 1s
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "50MB"
  backend-2:
    image: ghcr.io/micheloliveira-com/rinha-de-backend-2026-dotnet-csharp-with-faiss:20260507141710
    hostname: backend-2
    volumes:
      - sock:/run/sock
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - LISTEN_SOCK=/run/sock/api-2.sock
      - ConnectionStrings__faiss=http://faiss-backend:5000
    healthcheck:
      test: >
      interval: 1h
      timeout: 70s
      retries: 0
      start_period: 1s
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "50MB"
  faiss-backend:
    image: ghcr.io/micheloliveira-com/rinha-de-backend-2026-dotnet-csharp-with-python-faiss:20260507141710
    ports:
      - "5000" 
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "220MB"
  load-balancer:
    image: haproxy:3.3.8-alpine
    volumes:
      - sock:/run/sock
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "30MB"
volumes:
  sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,mode=0777"