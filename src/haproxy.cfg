global
    nbthread 1
    maxconn 4444
    ulimit-n 65000

defaults
    mode http
    retries 0
    option http-keep-alive
    option http-buffer-request
    timeout http-request 111s
    timeout connect 111s
    timeout client 111s
    timeout server 111s
    timeout http-keep-alive 111s

frontend front
    bind *:9999
    default_backend back

backend back
    balance roundrobin
    http-reuse aggressive
    server backend1 /run/sock/api-1.sock
    server backend2 /run/sock/api-2.sock
